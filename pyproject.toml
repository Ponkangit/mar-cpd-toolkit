[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mar-cpd-toolkit"
version = "0.1.0"
description = "Small reproducible baselines for change-point detection in matrix autoregressive time series."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "mar-cpd-toolkit contributors"}]
dependencies = ["numpy>=1.26"]
keywords = ["change-point", "matrix autoregression", "time series", "statistics", "reproducibility"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marcp-demo = "marcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
